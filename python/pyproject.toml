[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beeos-cloud-sdk"
version = "2.0.0"
description = "Typed BeeOS Cloud Server API client"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "BeeOS"}]
readme = {text = "Typed BeeOS Cloud Server SDK. BeeOSClient(base_url, api_key, timeout=30.0) uses a 30-second timeout; with_external_user retains it. Development: install the dev extra (mypy==2.4.0); run mypy --strict --python-version 3.11 beeos_cloud_sdk examples/typed_smoke.py. No request retries.", content-type = "text/markdown"}

[project.urls]
Homepage = "https://github.com/beeos-ai/beeos-cloud-sdks"
Repository = "https://github.com/beeos-ai/beeos-cloud-sdks"
Issues = "https://github.com/beeos-ai/beeos-cloud-sdks/issues"

[project.optional-dependencies]
dev = ["mypy==2.4.0"]

[tool.setuptools.package-data]
beeos_cloud_sdk = ["py.typed"]
