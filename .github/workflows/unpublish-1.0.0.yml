name: Unpublish cloud-sdk 1.0.0

on:
  workflow_dispatch:

permissions: {}

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Unpublish only cloud-sdk 1.0.0
        run: npm unpublish @beeos-ai/cloud-sdk@1.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify remaining versions and latest
        run: npm view @beeos-ai/cloud-sdk versions dist-tags --json
